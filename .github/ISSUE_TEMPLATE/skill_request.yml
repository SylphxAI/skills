name: Skill request
description: Propose a recurring job or an improvement to an existing skill
title: "[skill] "
labels: ["enhancement"]
body:
  - type: input
    id: job
    attributes:
      label: Recurring job
      description: State the result this skill should produce
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: Example request
      description: Provide a realistic request that should load this method
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related skills
      description: Name the closest existing packages and the semantic gap
    validations:
      required: false
