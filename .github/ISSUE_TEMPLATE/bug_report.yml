name: Bug report
description: Report incorrect skill behavior, a broken resource, or a script failure
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Package name under skills/, when applicable
    validations:
      required: false
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Git commit, tag, or installation date
    validations:
      required: false
  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
      description: Include the request, relevant files, and the smallest useful reproduction
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Agent host
      options:
        - Codex
        - Claude Code
        - Grok
        - Another Agent Skills host
        - Host independent
    validations:
      required: true
