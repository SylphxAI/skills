title: "[q] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Ask how to install, choose, or apply a skill.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent runtime
      options:
        - Codex
        - Claude Code
        - Grok
        - DeepSeek Harness (DSH)
        - Multiple hosts
        - Choosing a host
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you already tried
    validations:
      required: false
