name: check

# Agent-Native Queued Trunk (ADR-20260803):
# - PR head: attributable feedback (same-PR latest-wins)
# - merge_group: authoritative admission for Merge Queue
# - main push: post-land identity / pack smoke (not a second full admission lane)
# - Aggregate source verdict: source-ci/pass where declared

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede obsolete runs for the same PR; isolate merge_group and branch tips.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Matrix lanes exercise the declared Node floor (>=20) and the current
  # runtime (24), plus the python3 helper syntax floor.
  verify:
    name: check (${{ matrix.node-version }})
    # Company CI compute is owned by the managed runner plane. GitHub Actions
    # remains the workflow orchestrator; it is not a compute fallback.
    runs-on: sylphx-linux-standard
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # package.json declares node >=20; every declared floor must be tested,
        # not only the newest runtime.
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run
      # Python helper floor: package scripts under skills/*/scripts must at
      # least parse on the runner's python3 (syntax smoke; not dependency
      # integration, which is declared per-package qualification).
      - name: Python helper syntax smoke
        run: python3 -m py_compile $(find skills -name '*.py' -type f)
  # Merge-queue admission check: the ruleset requires a status named exactly
  # "check"; this aggregate preserves that name while the matrix lanes do the
  # real work above.
  check:
    name: check
    runs-on: sylphx-linux-standard
    timeout-minutes: 5
    needs: verify
    steps:
      - run: echo "matrix lanes passed"
