name: check

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  check:
    # Sylphx-owned runners only (owner standards/dx.md): no GitHub-hosted labels.
    runs-on: sylphx-linux-standard
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce Sylphx-owned runners
        run: bash .github/scripts/check-no-github-hosted-runners.sh
      # The self-hosted image does not promise Python or Node; pin both.
      # The package contract check runs the DSH mount oracle under node.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check package contract
        run: python3 tests/test_package_contract.py
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Validate Agent Skills
        run: |
          for skill in skills/*/; do
            uvx --from 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref' \
              skills-ref validate "$skill"
          done
      - name: Check local links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --no-progress 'skills/**/*.md'
          fail: true
      - name: Check bundled scripts
        run: |
          python3 -m compileall -q skills
          find skills -type f -name 'test_*.py' -print0 | \
            xargs -0 -r -n1 uv run --with numpy --with pillow python3
