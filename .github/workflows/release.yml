name: release-promotion

# Immutable promotion authority for AutoSync (docs/PROMOTION.md): an operator
# cuts a release from CI-green main; this workflow verifies the tree, generates
# promotion.json, creates the annotated skills-vX.Y.Z tag, pushes it, and files
# the GitHub Release. AutoSync applies only such tags, never mutable branch
# heads. The tag is the authority; the GitHub Release is the human projection.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version in X.Y.Z; promoted tag becomes skills-vX.Y.Z'
        required: true

permissions:
  contents: write

concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: sylphx-linux-standard
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/promote-release.mjs --version "${{ github.event.inputs.version }}"
      - name: Push promoted tag
        run: git push origin "skills-v${{ github.event.inputs.version }}"
      - name: File GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "skills-v${{ github.event.inputs.version }}" catalog.json --title "Sylphx Verified Capabilities skills-v${{ github.event.inputs.version }}" --notes "Promoted from CI-green main on the release-tag AutoSync channel (see docs/PROMOTION.md)."
