# Path-neutral coordination lineage (ADR-5127 / path-neutral admission).
#
# Does NOT scrape PR/commit text for Work: wi_….
# Does NOT fail ordinary reversible PRs toward direct-trunk.
# Optional: read Platform-posted status enact-work-lineage/pass when present.
# Missing Platform status does not block (this repo may not dens private
# Candidate binding yet). Platform status failure still fails closed.
name: Enact Work Lineage

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  push:

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  work-lineage:
    name: enact-work-lineage/pass
    runs-on: sylphx-linux-standard
    timeout-minutes: 5
    steps:
      - name: Path-neutral lineage (no public wi_ scrape; no ordinary-PR hard fail)
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LINEAGE_CONTEXT: enact-work-lineage/pass
          POLL_ATTEMPTS: '6'
          POLL_SLEEP_SECS: '5'
        run: |
          set -euo pipefail
          sha="${HEAD_SHA:-}"
          if [ -z "$sha" ]; then
            echo "::notice::no head SHA — skip lineage readback"
            exit 0
          fi
          if [ "${EVENT_NAME}" = "push" ]; then
            ref="${{ github.ref }}"
            default_branch="${{ github.event.repository.default_branch }}"
            if [ "$ref" != "refs/heads/${default_branch}" ]; then
              echo "non-default branch push — Candidate publication only; skip landing gate"
              exit 0
            fi
          fi
          echo "lineage_readback_sha=${sha}"
          echo "NOTE: public PR/commit text is not used for Work identity."
          echo "NOTE: ordinary work on a PR is valid (path-neutral admission)."

          attempt=1
          while [ "$attempt" -le "${POLL_ATTEMPTS}" ]; do
            resp=$(curl -sS --max-time 20 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: sylphx-lineage-readback" \
              "https://api.github.com/repos/${GH_REPOSITORY}/commits/${sha}/status" || true)
            parse=$(RESP_JSON="$resp" CTX="$LINEAGE_CONTEXT" python3 - <<'PY'
import json, os, re
raw = os.environ.get("RESP_JSON", "")
ctx = os.environ.get("CTX", "enact-work-lineage/pass")
try:
    d = json.loads(raw) if raw else {}
except Exception:
    print("STATE=error"); print("DESC=invalid_json"); raise SystemExit(0)
statuses = d.get("statuses") or []
hit = next((s for s in statuses if s.get("context") == ctx), None)
if not hit:
    print("STATE=missing"); print("DESC="); raise SystemExit(0)
state = (hit.get("state") or "").lower()
desc = re.sub(r"[\r\n]+", " ", str(hit.get("description") or ""))[:200]
print(f"STATE={state}"); print(f"DESC={desc}")
print("PUBLIC_WI_LEAK=yes" if "wi_" in desc.lower() else "PUBLIC_WI_LEAK=no")
PY
)
            state=$(printf '%s\n' "$parse" | sed -n 's/^STATE=//p' | head -1)
            desc=$(printf '%s\n' "$parse" | sed -n 's/^DESC=//p' | head -1)
            leak=$(printf '%s\n' "$parse" | sed -n 's/^PUBLIC_WI_LEAK=//p' | head -1)
            echo "attempt=${attempt} state=${state} desc=${desc}"
            if [ "${leak:-no}" = "yes" ]; then
              echo "::error::lineage status description projected raw Work id (wi_…)"
              exit 1
            fi
            case "${state}" in
              success)
                echo "pass: Platform coordination lineage success"
                exit 0
                ;;
              failure|error)
                echo "::error::Platform coordination lineage failed: ${desc}"
                exit 1
                ;;
              pending|missing|"")
                if [ "$attempt" -ge "${POLL_ATTEMPTS}" ]; then
                  echo "::notice::No Platform lineage status for ${sha:0:12} after poll — not blocking (path-neutral; no public wi_ required)."
                  exit 0
                fi
                sleep "${POLL_SLEEP_SECS}"
                attempt=$((attempt + 1))
                ;;
              *)
                echo "::notice::unexpected state=${state} — not blocking"
                exit 0
                ;;
            esac
          done
