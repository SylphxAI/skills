# ADR-4917 — Work lineage admission from base-branch policy.
# - pull_request_target: PR title/body (no untrusted checkout)
# - push: commit subjects/bodies in the pushed range (enables direct-trunk FF
#   after the same SHA is green on a branch tip)
# Verifies Work id exists in Enact via work.get (format-only IDs fail closed).
name: Enact Work Lineage

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  work-lineage:
    name: enact-work-lineage/pass
    runs-on: sylphx-linux-standard
    timeout-minutes: 5
    steps:
      - name: Require live Enact Work Item id
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          ENACT_READ_TOKEN: ${{ secrets.ENACT_READ_TOKEN }}
          ENACT_MCP_URL: https://enact.sylphx.com/api/mcp
        run: |
          set -euo pipefail
          if [ -z "${ENACT_READ_TOKEN:-}" ]; then
            echo "::error::ENACT_READ_TOKEN secret missing — cannot verify Work id against Enact"
            exit 1
          fi

          corpus=""
          if [ "${EVENT_NAME}" = "pull_request_target" ] || [ "${EVENT_NAME}" = "pull_request" ]; then
            corpus="${PR_TITLE}"$'\n'"${PR_BODY}"
          else
            # push: collect subjects+bodies for commits in range (cap 20)
            if [ -n "${BEFORE:-}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ] && [ -n "${AFTER:-}" ]; then
              # need git history — shallow checkout of range only via gh api to avoid untrusted scripts
              commits=$(curl -sS --max-time 30 \
                -H "Authorization: Bearer ${{ github.token }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/compare/${BEFORE}...${AFTER}" \
                | python3 -c 'import sys,json; d=json.load(sys.stdin); print("\n\n".join((c.get("commit") or {}).get("message","") for c in (d.get("commits") or [])[-20:]))')
              corpus="${commits}"
            else
              # new branch / empty before: use head commit message via API
              commits=$(curl -sS --max-time 30 \
                -H "Authorization: Bearer ${{ github.token }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/commits/${AFTER}" \
                | python3 -c 'import sys,json; d=json.load(sys.stdin); print((d.get("commit") or {}).get("message",""))')
              corpus="${commits}"
            fi
          fi

          if ! printf '%s' "$corpus" | grep -Eqo 'wi_01[0-9A-HJKMNP-TV-Z]{22,}'; then
            echo "::error::missing Enact Work lineage — include Work: wi_01… in the PR title/body (PR) or commit message (direct-trunk push)"
            exit 1
          fi
          id=$(printf '%s' "$corpus" | grep -Eo 'wi_01[0-9A-HJKMNP-TV-Z]{22,}' | head -1)
          payload=$(printf '%s' "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"work.get\",\"arguments\":{\"work_item_id\":\"$id\"}}}")
          resp=$(curl -sS --max-time 30 -X POST "$ENACT_MCP_URL" \
            -H "Authorization: Bearer ${ENACT_READ_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$payload")
          found=$(printf '%s' "$resp" | python3 -c 'import sys,json; d=json.load(sys.stdin); r=(d.get("result") or {}); print("yes" if (not d.get("error")) and (r.get("found") is True or bool((r.get("work_item") or {}).get("id"))) else "no")')
          if [ "$found" != "yes" ]; then
            echo "::error::Work id $id is not a live Enact Work Item (format-only / forged ids fail closed)."
            echo "$resp" | head -c 400
            exit 1
          fi
          echo "pass: live enact work lineage present ($id) event=${EVENT_NAME}"