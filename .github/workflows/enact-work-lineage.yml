# ADR-4917 / ADR-0044 — Work lineage admission + OIDC observe residual.
# pull_request_target: PR title/body only (no untrusted checkout).
# push: commit subjects/bodies for direct-trunk ruleset.
name: Enact Work Lineage

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  push:

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  work-lineage:
    name: enact-work-lineage/pass
    runs-on: sylphx-linux-standard
    timeout-minutes: 5
    steps:
      - name: Require live Enact Work Item id
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          ENACT_ACCESS_TOKEN: ${{ secrets.ENACT_ACCESS_TOKEN }}
          ENACT_READ_TOKEN: ${{ secrets.ENACT_READ_TOKEN }}
          ENACT_MCP_URL: https://enact.sylphx.com/api/mcp
          ENACT_REQUIRE_ACTIVE_CLAIM: ${{ vars.ENACT_REQUIRE_ACTIVE_CLAIM }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          token=""
          auth_class=""
          if [ -n "${ENACT_ACCESS_TOKEN:-}" ]; then
            token="${ENACT_ACCESS_TOKEN}"
            auth_class="workload_or_short_lived"
          elif [ -n "${ENACT_READ_TOKEN:-}" ]; then
            token="${ENACT_READ_TOKEN}"
            auth_class="static_break_glass"
            echo "::warning::Using static ENACT_READ_TOKEN (break-glass). Preferred path is short-lived GitHub OIDC → Enact observe exchange (ADR-4917/ADR-0044 residual)."
          else
            echo "::error::No Enact observe credential — set short-lived ENACT_ACCESS_TOKEN or break-glass ENACT_READ_TOKEN"
            exit 1
          fi

          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "github_oidc_request_endpoint=available"
            access=$(python3 -c "import base64; exec(base64.b64decode('').decode())")
            if [ -n "${access:-}" ]; then
              token="$access"
              auth_class="github_actions_oidc_observe"
              echo "github_oidc_exchange=success auth_class=${auth_class}"
            else
              echo "github_oidc_exchange=failed_or_not_enabled"
              if [ "$auth_class" = "static_break_glass" ]; then
                echo "::warning::OIDC observe exchange unavailable; continuing with static ENACT_READ_TOKEN break-glass"
              fi
            fi
          else
            echo "github_oidc_request_endpoint=unavailable auth_class=${auth_class}"
          fi

          corpus=""
          if [ "${EVENT_NAME}" = "pull_request_target" ] || [ "${EVENT_NAME}" = "pull_request" ]; then
            corpus="${PR_TITLE}"$'
          '"${PR_BODY}"
          else
            if [ -n "${BEFORE:-}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ] && [ -n "${AFTER:-}" ]; then
              commits=$(curl -sS --max-time 30 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GH_REPOSITORY}/compare/${BEFORE}...${AFTER}" \
                | python3 -c 'import sys,json; d=json.load(sys.stdin); print("\n\n".join((c.get("commit") or {}).get("message","") for c in (d.get("commits") or [])[-20:]))')
              corpus="${commits}"
            else
              commits=$(curl -sS --max-time 30 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GH_REPOSITORY}/commits/${AFTER}" \
                | python3 -c 'import sys,json; d=json.load(sys.stdin); print((d.get("commit") or {}).get("message",""))')
              corpus="${commits}"
            fi
          fi

          if ! printf '%s' "$corpus" | grep -Eqo 'wi_01[0-9A-HJKMNP-TV-Z]{22,}'; then
            echo "::error::missing Enact Work lineage — include Work: wi_01… in the PR title/body (PR) or commit message (direct-trunk push)"
            exit 1
          fi
          id=$(printf '%s' "$corpus" | grep -Eo 'wi_01[0-9A-HJKMNP-TV-Z]{22,}' | head -1)
          payload=$(printf '%s' "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"work.get\",\"arguments\":{\"work_item_id\":\"$id\"}}}")
          resp=$(curl -sS --max-time 30 -X POST "$ENACT_MCP_URL" \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$payload")

          parse_out=$(RESP_JSON="$resp" python3 -c "import base64,os; exec(base64.b64decode('').decode())")
          eval "$parse_out"

          if [ "${FOUND:-}" != "yes" ]; then
            echo "::error::Work id $id is not a live Enact Work Item (format-only / forged ids fail closed)."
            echo "$resp" | head -c 400
            exit 1
          fi

          echo "lineage.work_id=${id}"
          echo "lineage.work_status=${WORK_STATUS:-}"
          echo "lineage.auth_class=${auth_class}"
          echo "lineage.claim_holder=${CLAIM_HOLDER:-}"
          echo "lineage.claim_id=${CLAIM_ID:-}"
          echo "lineage.claim_status=${CLAIM_STATUS:-}"
          echo "lineage.agent_run_id=${AGENT_RUN_ID:-}"
          echo "lineage.lease_expires_at=${LEASE_EXPIRES:-}"
          echo "lineage.has_active_claim=${HAS_ACTIVE_CLAIM:-no}"
          # Claim/Run loop proof (durable): active lease OR checkpoint/run/evidence.
          # Existence-only Work stamps are the agent-native adoption gap. Direct-trunk push requires proof.
          linked_payload=$(printf '%s' "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"work.linked_status\",\"arguments\":{\"work_item_id\":\"$id\"}}}")
          linked_resp=$(curl -sS --max-time 30 -X POST "$ENACT_MCP_URL" \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$linked_payload" || true)
          linked_parse=$(RESP_JSON="$linked_resp" python3 -c "import base64,os; exec(base64.b64decode('').decode())")
          eval "$linked_parse"
          echo "lineage.claim_loop_proof=${CLAIM_LOOP_PROOF:-no}"
          echo "lineage.checkpoint_run=${CHECKPOINT_RUN:-}"
          echo "lineage.evidence_kinds=${EVIDENCE_KINDS:-0}"
          echo "lineage.linked_claimed=${LINKED_CLAIMED:-no}"

          require_active="${ENACT_REQUIRE_ACTIVE_CLAIM:-}"
          # Direct-trunk push: require durable claim/run loop proof by default.
          # PR lane: telemetry unless ENACT_REQUIRE_ACTIVE_CLAIM hard-enforces.
          if [ "${HAS_ACTIVE_CLAIM:-no}" = "yes" ] || [ "${CLAIM_LOOP_PROOF:-no}" = "yes" ]; then
            echo "pass: live enact work lineage + claim/run loop proof (${id} holder=${CLAIM_HOLDER:-none} run=${AGENT_RUN_ID:-${CHECKPOINT_RUN:-none}} evidence_kinds=${EVIDENCE_KINDS:-0}) event=${EVENT_NAME} auth=${auth_class}"
          else
            msg="Work ${id} exists but has no claim/run loop proof (no active Claim/Run, no checkpoint run, no evidence). Existence-only Work stamps do not satisfy agent-native adoption."
            if [ "${require_active}" = "1" ] || [ "${require_active}" = "true" ] || [ "${EVENT_NAME}" = "push" ]; then
              echo "::error::${msg}"
              if [ "${EVENT_NAME}" = "push" ]; then
                echo "::error::direct-trunk requires claim-before-mutation proof (active claim, checkpoint with agent_run_id, or published evidence on the Work)."
              fi
              exit 1
            fi
            echo "::notice::${msg}"
            echo "pass: live enact work lineage present (${id}) without claim/run loop proof — PR telemetry only; event=${EVENT_NAME} auth=${auth_class}"
          fi
      - name: Ordinary docs-only PRs must use direct-trunk
        if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ENACT_REQUIRE_ORDINARY_DIRECT_TRUNK: ${{ vars.ENACT_REQUIRE_ORDINARY_DIRECT_TRUNK }}
        run: |
          set -euo pipefail
          enforce="${ENACT_REQUIRE_ORDINARY_DIRECT_TRUNK:-true}"
          case "$enforce" in 0|false|FALSE|no|NO) enforce=false ;; *) enforce=true ;; esac
          if [ -z "${PR_NUMBER:-}" ]; then echo "skip: no PR number"; exit 0; fi
          files_json=$(curl -sS --max-time 30 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100")
          ENFORCE="$enforce" FILES_JSON="$files_json" python3 -c "import base64,os; exec(base64.b64decode('').decode())"
