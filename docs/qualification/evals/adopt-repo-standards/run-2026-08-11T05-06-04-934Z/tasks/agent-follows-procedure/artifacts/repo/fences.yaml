schemaVersion: 1
kind: RepoFences
owner: acme-app-owner
fences:
  - id: instruction-authority
    rule: AGENTS.md is the sole active runtime constitution and projects the Sylphx constitution by link only; it must not restate legacy rules or fork detailed standards.
    enforcement: conformance/check.mjs
  - id: project-facts
    rule: project.manifest.json validates against the canonical project-manifest schema, and PROJECT.md agrees with its facts.
    enforcement: conformance/check.mjs
  - id: dependency-fence
    rule: No runtime, dev, or peer dependencies are permitted without an ADR.
    enforcement: conformance/check.mjs
  - id: legacy-retirement
    rule: The predecessor instruction layout exists only as the dated, non-authoritative AGENTS.legacy.md residual.
    enforcement: conformance/check.mjs
